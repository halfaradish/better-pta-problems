<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>更好的题目集</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --hairline: #eceff2;
      --text: #242a32;
      --text-2: #5c6672;
      --text-3: #6f7a88;
      --accent: #0a4991;
      --accent-strong: #0a4991;
      --accent-fill: #0a4991;
      --accent-soft: #e8f0fa;
      --accent-ring: rgba(10, 73, 145, .16);
      --input-bg: #f6f8fa;
      --input-border: #dfe3e8;
      --switch-off: #d6dbe1;
      --ok: #2b8a3e;
      --err: #e03131;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1c20;
        --hairline: #2a2d33;
        --text: #e9ebee;
        --text-2: #a8b0bb;
        --text-3: #8d96a3;
        --accent: #79aaee;
        --accent-strong: #8fbbf3;
        --accent-fill: #2b6cb8;
        --accent-soft: rgba(88, 140, 220, .2);
        --accent-ring: rgba(121, 170, 238, .28);
        --input-bg: #22252b;
        --input-border: #34383f;
        --switch-off: #3a3f47;
        --ok: #55c07a;
        --err: #f47067;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0; padding: 8px 16px 5px;
      background: var(--bg); color: var(--text);
      font: 13px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input:focus-visible, textarea:focus-visible { outline: none; }

    /* ---------- 头部 ---------- */
    .head { display: flex; align-items: center; gap: 10px; padding-bottom: 5px; }
    .head img { width: 30px; height: 30px; border-radius: 8px; }
    .head-title { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
    .ver { font-size: 11px; font-weight: 500; line-height: 17px; padding: 0 7px; border: 1px solid var(--input-border); border-radius: 9999px; background: var(--input-bg); color: var(--text-2); }
    .head-sub { margin-top: 1px; font-size: 12px; color: var(--text-3); }

    main > * + * { border-top: 1px solid var(--hairline); }
    section, details { padding: 4px 0 5px; }

    /* ---------- 开关（原生 checkbox 样式化，保留键盘与读屏语义） ---------- */
    .switch {
      appearance: none; -webkit-appearance: none; flex: none;
      width: 36px; height: 20px; margin: 0; border-radius: 9999px;
      background: var(--switch-off); cursor: pointer; position: relative;
      transition: background .18s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
      transition: transform .18s ease;
    }
    .switch:checked { background: var(--accent-fill); }
    .switch:checked::after { transform: translateX(16px); }
    .switch:disabled, input:disabled, textarea:disabled, button:disabled { opacity: .45; cursor: not-allowed; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; cursor: pointer; }
    .row .q { margin-left: 6px; font-size: 12px; color: var(--text-3); }

    /* ---------- 主开关行：面板的锚点控件，开启时整行淡蓝 ---------- */
    .master {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 -16px; padding: 6px 16px;
      transition: background .18s ease;
    }
    .master:has(#enabled:checked) { background: var(--accent-soft); }
    .master .row-text { display: flex; flex-direction: column; }
    .master .row-title { font-weight: 600; }
    .when-on, .when-off { display: none; font-size: 12px; color: var(--text-2); }
    .master:has(#enabled:checked) .when-on { display: block; }
    .master:not(:has(#enabled:checked)) .when-off { display: block; }
    .rows { padding: 2px 0 0; }

    /* ---------- 可折叠区块（课程识别） ---------- */
    summary {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 28px; cursor: pointer; list-style: none; font-weight: 600;
    }
    summary::-webkit-details-marker { display: none; }
    .caret {
      flex: none; width: 7px; height: 7px; margin-right: 3px;
      border-right: 1.6px solid var(--text-3); border-bottom: 1.6px solid var(--text-3);
      transform: rotate(45deg); transition: transform .15s ease;
    }
    details[open] .caret { transform: rotate(225deg); }

    /* ---------- 字段 ---------- */
    .field { margin-top: 6px; }
    .field-label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-2); }
    input[type="text"], textarea {
      width: 100%; padding: 5px 9px;
      border: 1px solid var(--input-border); border-radius: 8px;
      background: var(--input-bg); color: var(--text); font: inherit;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none; border-color: var(--accent); background: var(--bg);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }
    input::placeholder, textarea::placeholder { color: var(--text-3); }
    textarea { resize: vertical; min-height: 64px; }
    .hint { margin: 3px 0 0; font-size: 12px; color: var(--text-3); }

    /* ---------- 提醒区 ---------- */
    .sec-head { font-weight: 600; margin-bottom: 2px; }
    .test-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .status { min-width: 0; font-size: 12px; color: var(--text-2); }
    .status.ok { color: var(--ok); font-weight: 500; }
    .status.err { color: var(--err); }

    /* ---------- 按钮 ---------- */
    button {
      font: inherit; padding: 5px 12px;
      border: 1px solid var(--input-border); border-radius: 8px;
      background: var(--bg); color: var(--text); cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-primary { min-width: 100px; border-color: transparent; background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
    .btn-primary:hover:not(:disabled) { border-color: transparent; filter: brightness(.96); }
    .btn-ghost { min-height: 28px; padding: 4px 10px; font-size: 12px; }

    /* ---------- 页脚 ---------- */
    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 2px; padding-top: 7px; border-top: 1px solid var(--hairline);
    }
    .repo {
      display: inline-flex; align-items: center; gap: 6px; min-width: 0; min-height: 28px;
      color: var(--text-2); font-size: 12px; text-decoration: none;
    }
    .repo:hover { color: var(--accent); }
    .repo svg { flex: none; width: 14px; height: 14px; fill: currentColor; }
    .repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="head">
    <img src="../icons/icon48.png" alt="" width="30" height="30">
    <div class="head-text">
      <div class="head-title">更好的题目集 <span class="ver" id="version">v0.8.0</span></div>
      <div class="head-sub">PTA 题目集列表增强</div>
    </div>
  </header>

  <main>
    <section class="enhance">
      <div class="master">
        <label class="row" for="enabled">
          <span class="row-text">
            <span class="row-title">启用增强</span>
            <span class="when-on">列表页按下方配置增强</span>
            <span class="when-off">已停用，页面保持 PTA 原样</span>
          </span>
          <input type="checkbox" class="switch" id="enabled" checked>
        </label>
      </div>
      <div class="rows">
        <label class="row"><span class="row-text">卡片课程徽章</span><input type="checkbox" class="switch" id="badge" checked></label>
        <label class="row"><span class="row-text">截止倒计时<span class="q">剩 7 天内显示</span></span><input type="checkbox" class="switch" id="countdown" checked></label>
        <label class="row"><span class="row-text">同教师课程归并</span><input type="checkbox" class="switch" id="mergeSimilar" checked></label>
        <label class="row"><span class="row-text">新标签页打开题目集</span><input type="checkbox" class="switch" id="openInNewTab" checked></label>
        <label class="row"><span class="row-text">答题进度<span class="q">考试型题目集</span></span><input type="checkbox" class="switch" id="progress" checked></label>
      </div>
    </section>

    <details>
      <summary>课程识别与高级规则<span class="caret" aria-hidden="true"></span></summary>
      <div class="field">
        <label class="field-label" for="separators">课程名分隔符</label>
        <input type="text" id="separators" value="--,｜,|" autocomplete="off" spellcheck="false">
        <p class="hint">逗号分隔多个；标题命中即取前段为课程名</p>
      </div>
      <div class="field">
        <label class="field-label" for="rules">自定义规则</label>
        <textarea id="rules" rows="3" placeholder="例如：2025- => 2025级课程"></textarea>
        <p class="hint">每行一条「关键词=&gt;课程名」，包含匹配，优先于自动识别；无分隔符时按 作业/实验/考试/期中/复习题 等关键词识别</p>
      </div>
    </details>

    <section>
      <div class="sec-head">题目关闭倒计时提醒</div>
      <label class="row"><span class="row-text">启用邮件提醒</span><input type="checkbox" class="switch" id="reminderEnabled" checked></label>
      <div class="field">
        <label class="field-label" for="reminderServer">提醒服务器</label>
        <input type="text" id="reminderServer" placeholder="例如 123.45.67.89:8787" autocomplete="off" spellcheck="false">
        <p class="hint">自建后端地址 ip:port，配置令牌时写作 ip:port/令牌</p>
      </div>
      <div class="field">
        <label class="field-label" for="reminderEmail">接收邮箱</label>
        <input type="text" id="reminderEmail" placeholder="you@example.com" autocomplete="off" spellcheck="false">
        <p class="hint">打开 PTA 即自动同步；截止前 3 天、1 天各发一封</p>
      </div>
      <div class="test-row">
        <button type="button" id="testReminder" class="btn-primary">发送测试邮件</button>
        <span id="reminderStatus" class="status" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <footer>
    <a class="repo" href="https://github.com/halfaradish/better-pta-problems" target="_blank" rel="noreferrer" title="GitHub 仓库">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span>halfaradish/better-pta-problems</span>
    </a>
    <button type="button" id="reset" class="btn-ghost">恢复默认</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
