# 推送 v* tag 自动发版：把 extension/ 与《安装教程》打成 zip 发布到 GitHub Releases。
# zip 解压后是一个目录：extension/（浏览器加载这个子文件夹）+ 安装教程.html。
# Release 标题/正文取自附注 tag（git tag -a -m "…"）的信息，结尾自动追加一段安装提示。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要（重）发布的 tag，如 v0.8.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码（完整历史，含 tag 对象上的附注信息）
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: 准备 Node（校验产物与源码一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 manifest 版本一致
        run: |
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(jq -r .version extension/manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag「$TAG」与 extension/manifest.json 的 version「$MANIFEST_VERSION」不一致；请先更新 manifest 版本号，删掉远端 tag 重新打"
            exit 1
          fi

      - name: 校验 extension/ 产物与 src/ 源码一致（构建漂移守卫）
        run: |
          npm ci
          npm run build
          if ! git diff --exit-code -- extension; then
            echo "::error::extension/ 下的构建产物与 src/ 源码不一致；请在本地执行 npm run build 后把产物一并提交"
            exit 1
          fi

      - name: 打包发行 zip（extension/ + 安装教程，顺带校验 tag 与 manifest 版本一致）
        run: npm run package -- --tag "$TAG"

      - name: 断言发行包内容与版本
        run: |
          STAGE="dist/better-pta-problems-${TAG}"
          test -f "${STAGE}/extension/manifest.json" || { echo "::error::发行包缺少 extension/manifest.json"; exit 1; }
          test -f "${STAGE}/安装教程.html" || { echo "::error::发行包缺少 安装教程.html（教程正文 docs/安装教程.md 是否已提交？）"; exit 1; }
          PKG_VERSION="$(jq -r .version "${STAGE}/extension/manifest.json")"
          [ "$PKG_VERSION" = "${TAG#v}" ] || { echo "::error::包内版本 $PKG_VERSION 与 tag $TAG 不一致"; exit 1; }
          unzip -l "dist/better-pta-problems-${TAG}.zip"

      - name: 提取 tag 信息作为 Release 说明，并追加安装提示
        run: |
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG")"
            BODY="$(git tag -l --format='%(contents:body)' "$TAG")"
            {
              echo "$SUBJECT"
              if [ -n "$BODY" ]; then echo; echo "$BODY"; fi
            } > release_notes.md
            echo "RELEASE_TITLE=$SUBJECT" >> "$GITHUB_ENV"
          else
            echo "轻量 tag「$TAG」没有 tag 信息，本次更新见该 tag 的提交记录。" > release_notes.md
          fi
          cat >> release_notes.md <<'EOF'

          ---

          **怎么安装**：下载下面的 zip，解压到一个固定位置（以后升级覆盖同一位置即可保留设置），双击解压目录里的 `安装教程.html` 跟着做——在 `chrome://extensions`（Edge 为 `edge://extensions`）打开开发者模式，点「加载已解压的扩展程序」，选择解压目录里的 **`extension` 子文件夹**。
          EOF

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "dist/better-pta-problems-${TAG}.zip" \
            --title "${RELEASE_TITLE:-$TAG}" --notes-file release_notes.md
