# 推送 v* tag 自动发版：把 extension/ 打成 zip 发布到 GitHub Releases。
# Release 标题/正文取自附注 tag（git tag -a -m "…"）的信息；轻量 tag 没有 tag 信息，回退为自动生成说明。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要（重）发布的 tag，如 v0.8.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码（完整历史，含 tag 对象上的附注信息）
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: 准备 Node（校验产物与源码一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 manifest 版本一致
        run: |
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(jq -r .version extension/manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag「$TAG」与 extension/manifest.json 的 version「$MANIFEST_VERSION」不一致；请先更新 manifest 版本号，删掉远端 tag 重新打"
            exit 1
          fi

      - name: 校验 extension/ 产物与 src/ 源码一致（构建漂移守卫）
        run: |
          npm ci
          npm run build
          if ! git diff --exit-code -- extension; then
            echo "::error::extension/ 下的构建产物与 src/ 源码不一致；请在本地执行 npm run build 后把产物一并提交"
            exit 1
          fi

      - name: 打包插件 zip（zip 内为一个目录，解压后可直接「加载已解压的扩展程序」）
        run: |
          STAGE="better-pta-problems-${TAG}"
          mkdir -p dist "$STAGE"
          cp -r extension/. "$STAGE/"
          zip -qr "dist/${STAGE}.zip" "$STAGE"

      - name: 提取 tag 信息作为 Release 说明
        run: |
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG")"
            BODY="$(git tag -l --format='%(contents:body)' "$TAG")"
            {
              echo "$SUBJECT"
              if [ -n "$BODY" ]; then echo; echo "$BODY"; fi
            } > release_notes.md
            echo "RELEASE_TITLE=$SUBJECT" >> "$GITHUB_ENV"
          fi

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="dist/better-pta-problems-${TAG}.zip"
          ARGS=(--title "${RELEASE_TITLE:-$TAG}")
          if [ -f release_notes.md ]; then
            ARGS+=(--notes-file release_notes.md)
          else
            ARGS+=(--generate-release-notes)
          fi
          gh release create "$TAG" "$ZIP" "${ARGS[@]}"
